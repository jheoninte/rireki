name: Deploy to Cloudflare Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # pnpm is run through npx instead of a third-party action, so only GitHub-owned actions are used.
      - run: npx --yes pnpm@10.34.9 install --frozen-lockfile
      - name: Build
        run: npx --yes pnpm@10.34.9 build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_CLOUD_ENABLED: ${{ secrets.VITE_CLOUD_ENABLED }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
      - name: Refuse to deploy a build without cloud/auth config
        run: grep -rqs "supabase.co" dist/assets || { echo "Supabase config missing from build"; exit 1; }
      - name: Deploy
        run: npx --yes wrangler@4.166.0 pages deploy dist --project-name=rireki-easy --branch=main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: fe3135135a2ef04ba59361778827023a
